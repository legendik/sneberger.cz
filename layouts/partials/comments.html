{{- with .Site.Params.giscus -}}
  {{- if .repo -}}
    <div class="comments">
      <script src="https://giscus.app/client.js"
              data-repo="{{ .repo }}"
              data-repo-id="{{ .repoID }}"
              data-category="{{ .category }}"
              data-category-id="{{ .categoryID }}"
              data-mapping="{{ .mapping | default "pathname" }}"
              data-strict="1"
              data-reactions-enabled="1"
              data-emit-metadata="0"
              data-input-position="top"
              data-theme="{{ .theme | default "transparent_dark" }}"
              data-lang="{{ .lang | default "en" }}"
              data-loading="lazy"
              crossorigin="anonymous"
              async>
      </script>
      <noscript>Comments require JavaScript. You can also reply on
        <a href="https://github.com/{{ .repo }}/discussions">GitHub Discussions</a>.</noscript>
    </div>
  {{- end -}}
{{- end -}}
