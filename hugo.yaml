# Basic site configuration
baseURL: "https://sneberger.cz/"
locale: "en-us"
defaultContentLanguage: "en"
title: "Šneberger Marek"
theme: "terminal"

# Content management
pagination:
  pagerSize: 10
summaryLength: 30
enableEmoji: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false

# URL management
permalinks:
  posts: "/post/:year/:month/:slug/"

# Syntax highlighting settings
markup:
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: false
    lineNumbersInTable: true
    noClasses: false
    style: "native"
  goldmark:
    renderer:
      unsafe: true

# Taxonomies (for organizing content)
taxonomies:
  category: categories
  tag: tags
  series: series  # Useful for multi-part technical posts

languages:
  en:
    title: "Šneberger Marek"
    copyright: "© 2025 Marek Šneberger"

    # The Terminal theme reads all of these from Site.Params, so they must live
    # under `params:` — at the language's top level they are silently dropped.
    params:
      # Also drawn on the share card — rerun scripts/make-og-image.py if this changes.
      subtitle: "Backend Systems, Automation & AI Tooling"
      keywords: "backend development, golang, typescript, architecture, automation, n8n, ai tooling, homelab"
      menuMore: "Show more"
      readMore: "Read more →"
      readOtherPosts: "Other posts"
      newerPosts: "← Newer"
      olderPosts: "Older →"
      missingContentMessage: "Nothing here yet..."
      missingBackButtonLabel: "← Back home"
      minuteReadingTime: "min read"
      words: "words"

      logo:
        logoText: "~/sneberger"
        logoHomeLink: "/"

    menu:
      main:
        - identifier: "posts"
          name: "~/posts"
          url: "/posts/"
          weight: 1
        - identifier: "tags"
          name: "~/tags"
          url: "/tags/"
          weight: 2

params:
  # Terminal theme specific settings
  contentTypeName: "posts"
  showMenuItems: 2
  fullWidthTheme: true
  centerTheme: false
  autoCover: true
  showLastUpdated: true
  readingTime: true
  toc: true
  tocTitle: "Contents"

  # Site metadata
  author: "Marek Šneberger"

  # Comments system (rendered by layouts/partials/comments.html)
  giscus:
    repo: "legendik/sneberger.cz"
    repoID: "R_kgDOGWIH5Q"
    category: "Blog Comments"
    categoryID: "DIC_kwDOGWIH5c4CnXs3"
    mapping: "pathname"

  # Social links (Terminal theme format)
  twitter:
    creator: "SnebergerMarek"
    site: "SnebergerMarek"
